# Run ORDER-SERVICE on port 9192
server:
  port: 9192

spring:

  # Configure the ORDER-SERVICE H2 database
  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Configure Hibernate and show generated SQL in the console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Enable the H2 browser console
  h2:
    console:
      enabled: true
