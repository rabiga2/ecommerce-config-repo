# 1. Run PAYMENT-SERVICE on port 9191
server:
  port: 9191

# 2. Spring configurations 
spring:

  # 2.1. PAYMENT-SERVICE: Database URL and credentials 
  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 2.2. PAYMENT-SERVICE: Enable JPA Hibernate 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # 2.3. PAYMENT-SERVICE Enable H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

# 3. ORDER-SERVICE getOrderDetails() URL
order:
  service:
    url: http://localhost:9192/order/details
