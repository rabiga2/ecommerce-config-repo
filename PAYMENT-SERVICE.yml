# 1. Run PAYMENT-SERVICE on port 9191
server:
  port: 9191

spring:
  # 2. Configure the PAYMENT-SERVICE H2 database
  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 3. Configure Hibernate and display SQL queries
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # 4. Enable the H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
