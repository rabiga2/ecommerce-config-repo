server:
  port: 9194

spring:
  datasource:
    url: jdbc:h2:mem:cartdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# PRODUCT-SERVICE endpoint
microservice:
  product-service:
    endpoints:
      get-product-uri: http://localhost:9195/ecom/products/productId
