server:
  port: 9194

spring:
  datasource:
    url: jdbc:h2:mem:cartdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console


# Routs 
microservice:
  # PRODUCT-SERVICE endpoint
  product-service:
    endpoints:
      get-product-uri: http://PRODUCT-SERVICE/ecom/products/productId

  # USER-SERVICE endpoint
  user-service:
    endpoints:
      get-current-user-uri: http://USER-SERVICE/user/me
